services:
  db:
    image: postgres:16-alpine
    container_name: wealthi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wealthi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wealthi_secret}
      POSTGRES_DB: ${POSTGRES_DB:-wealthi_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-wealthi} -d ${POSTGRES_DB:-wealthi_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
