name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Mutation testing is too slow for every push: weekly, or by hand.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job runs on synthetic fixtures only (backend/test/fixtures). The
# database is a throwaway service named *_test — the suites refuse any other.
env:
  NODE_VERSION: 22
  TEST_DATABASE_URL: postgresql://wealthi:wealthi@localhost:5432/wealthi_test
  DATABASE_URL: postgresql://wealthi:wealthi@localhost:5432/wealthi_test

jobs:
  backend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wealthi
          POSTGRES_PASSWORD: wealthi
          POSTGRES_DB: wealthi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wealthi -d wealthi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # npm 10's arborist crashes on this tree (see AGENTS.md).
      - run: npx -y npm@11 ci
        working-directory: .
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Unit + integration (against the service above), failing under the thresholds in vitest.config.mts.
      - run: npm run test:coverage
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore

  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npx -y npm@11 ci
        working-directory: .
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage

  e2e:
    if: github.event_name != 'schedule'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wealthi
          POSTGRES_PASSWORD: wealthi
          POSTGRES_DB: wealthi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wealthi -d wealthi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npx -y npm@11 ci
      - run: npx prisma generate
        working-directory: backend
      - run: npm run typecheck:e2e
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npx -y npm@11 ci
        working-directory: .
      - run: npx prisma generate
      - run: npm run test:mutation
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: backend/reports/mutation
